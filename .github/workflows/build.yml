name: Build All Platforms

on:
  push:
    branches:
      - pyinstaller
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --name PhantomSprinter \
            --icon icon.png \
            --add-data "assets:assets" \
            --add-data "level:level" \
            main.py

      # ─────────────────────────────
      # WINDOWS (single .exe)
      # ─────────────────────────────
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          mv PhantomSprinter.exe PhantomSprinter-Windows.exe

      # ─────────────────────────────
      # LINUX (single binary)
      # ─────────────────────────────
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          mv PhantomSprinter PhantomSprinter-Linux

      # ─────────────────────────────
      # MACOS (zip)
      # ─────────────────────────────
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -r PhantomSprinter-macOS.zip PhantomSprinter.app || zip -r PhantomSprinter-macOS.zip PhantomSprinter

      # ─────────────────────────────
      # Upload clean artifacts only
      # ─────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            dist/PhantomSprinter-Windows.exe
            dist/PhantomSprinter-Linux
            dist/PhantomSprinter-macOS.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files (debug)
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta Build
          prerelease: true
          files: |
            artifacts/**